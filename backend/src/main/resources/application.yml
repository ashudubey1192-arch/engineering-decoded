spring:
  application:
    name: engineering-decoded-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/engineering_decoded}
    username: ${DATABASE_USERNAME:engineering}
    password: ${DATABASE_PASSWORD:engineering}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
management:
  endpoints.web.exposure.include: health,info,metrics
app:
  java-runner:
    url: ${JAVA_RUNNER_URL:}
    token: ${JAVA_RUNNER_TOKEN:}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-with-at-least-32-characters}
    ttl: ${JWT_TTL:PT8H}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  auth:
    expose-development-tokens: ${EXPOSE_DEVELOPMENT_TOKENS:false}
